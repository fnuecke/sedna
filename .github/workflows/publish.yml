name: publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' build

      - name: Add Artifacts to GitHub Release
        run: gh release upload '${{ github.event.release.tag_name }}' ./build/libs/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Maven Central
        run: ./gradlew -Psemver='${{ github.event.release.tag_name }}' publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
